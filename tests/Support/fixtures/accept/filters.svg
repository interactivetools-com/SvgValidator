<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="lit">
      <feDiffuseLighting in="SourceGraphic" result="light" lighting-color="#fff">
        <fePointLight x="10" y="10" z="20"/>
      </feDiffuseLighting>
      <feComposite in="SourceGraphic" in2="light" operator="arithmetic" k1="1" k2="0" k3="0" k4="0"/>
    </filter>
    <mask id="fade">
      <linearGradient id="fadeGrad" x1="0" x2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
      <rect width="40" height="40" fill="url(#fadeGrad)"/>
    </mask>
  </defs>
  <rect x="4" y="4" width="14" height="14" fill="#1D4ED8" filter="url(#shadow)"/>
  <circle cx="29" cy="11" r="7" fill="#EC4899" filter="url(#lit)"/>
  <rect x="4" y="22" width="32" height="14" fill="#6366F1" mask="url(#fade)"/>
</svg>
